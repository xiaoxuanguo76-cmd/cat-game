<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>爱很奇怪 - 小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #fff;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameCanvas {
            width: 100vw;
            height: auto;
            max-height: 100vh;
            object-fit: contain;
        }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 游戏逻辑分辨率，固定不变
const GAME_WIDTH = 1080;
const GAME_HEIGHT = 1920;

canvas.width = GAME_WIDTH;
canvas.height = GAME_HEIGHT;

// 图片资源
const imgCat = new Image();
imgCat.src = "cat.PNG";

const imgPipeTop = new Image();
imgPipeTop.src = "pipe-top.PNG";

const imgPipeBottom = new Image();
imgPipeBottom.src = "pipe-bottom.PNG";

const imgBg = new Image();
imgBg.src = "bg.JPG";

let bird = {
    x: 200,
    y: GAME_HEIGHT / 2,
    size: 250,
    velocity: 0,
    gravity: 0.6,
    jumpForce: -16
};

let pipes = [];
const pipeWidth = 160;
const pipeGap = 550;
let pipeSpeed = 4;
let score = 0;
let gameOver = false;

function jump() {
    if (gameOver) {
        restartGame();
    } else {
        bird.velocity = bird.jumpForce;
    }
}

canvas.addEventListener("click", jump);
canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    jump();
});

function createPipe() {
    const minTopHeight = 200;
    const maxTopHeight = GAME_HEIGHT - pipeGap - 200;
    const topHeight = Math.random() * maxTopHeight + minTopHeight;

    pipes.push({
        x: GAME_WIDTH,
        topHeight: topHeight,
        scored: false
    });
}

function restartGame() {
    bird.y = GAME_HEIGHT / 2;
    bird.velocity = 0;
    pipes = [];
    score = 0;
    gameOver = false;
}

function checkCollision(pipe) {
    const birdShrink = 95;
    const bx1 = bird.x + birdShrink;
    const bx2 = bird.x + bird.size - birdShrink;
    const by1 = bird.y + birdShrink;
    const by2 = bird.y + bird.size - birdShrink;

    const px1 = pipe.x;
    const px2 = pipe.x + pipeWidth;

    if (!(bx2 > px1 && bx1 < px2)) {
        return false;
    }

    const pipeBlankOffset = 120;
    const topPipeRealBottom = pipe.topHeight - pipeBlankOffset;
    const bottomPipeRealTop = pipe.topHeight + pipeGap + pipeBlankOffset;

    if (by1 < topPipeRealBottom) {
        return true;
    }

    if (by2 > bottomPipeRealTop) {
        return true;
    }

    if (by1 <= 0 || by2 >= GAME_HEIGHT) {
        return true;
    }

    return false;
}

function draw() {
    ctx.drawImage(imgBg, 0, 0, GAME_WIDTH, GAME_HEIGHT);

    if (!gameOver) {
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;
    }

    ctx.drawImage(imgCat, bird.x, bird.y, bird.size, bird.size);

    for (let i = pipes.length - 1; i >= 0; i--) {
        let p = pipes[i];

        ctx.drawImage(imgPipeTop, p.x, 0, pipeWidth, p.topHeight);
        ctx.drawImage(imgPipeBottom, p.x, p.topHeight + pipeGap, pipeWidth, GAME_HEIGHT - p.topHeight - pipeGap);

        if (!gameOver) {
            p.x -= pipeSpeed;

            if (checkCollision(p)) {
                gameOver = true;
            }

            if (!p.scored && p.x + pipeWidth < bird.x) {
                score++;
                p.scored = true;
            }
        }

        if (p.x + pipeWidth < 0) {
            pipes.splice(i, 1);
        }
    }

    if (!gameOver && (pipes.length === 0 || pipes[pipes.length - 1].x < GAME_WIDTH - 380)) {
        createPipe();
    }

    ctx.fillStyle = "#333";
    ctx.font = "60px sans-serif";
    ctx.fillText(`分数：${score}`, 60, 100);

    if (gameOver) {
        ctx.font = "80px sans-serif";
        ctx.fillText("游戏结束，点击重新开始", 80, GAME_HEIGHT / 2);
    }

    requestAnimationFrame(draw);
}

imgBg.onload = draw;
</script>
</body>
</html>
